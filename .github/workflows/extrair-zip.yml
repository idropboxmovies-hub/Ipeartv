name: Extrair projeto

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair zip e organizar
        run: |
          unzip -o Ipeartv-corrigido.zip -d _tmp
          git rm -f --ignore-unmatch AndroidManifest.xml Apps.kt HomeActivity.kt MainActivity.kt ic_launcher.xml strings.xml themes.xml
          cp -r _tmp/. .
          rm -rf _tmp Ipeartv-corrigido.zip
          git add -A
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Organiza projeto Android na estrutura correta"
          git push
